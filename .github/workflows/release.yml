name: Production Release CD

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
      - '!v*-rc*'
      - '!v*-alpha*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, Sign & Publish Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release signing secrets exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: Production releases require RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD secrets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Verify zero-network manifest invariant
        run: |
          if grep -q 'uses-permission.*android\.permission\.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.INTERNET must not be declared."
            exit 1
          fi

      - name: Generate ephemeral debug keystore for unit test task
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests & build minified release artifacts
        run: |
          gradle :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Sign & verify release APK and AAB
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF#refs/tags/}"
          BUILD_TOOLS=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-ci.keystore
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          [ -f "$UNSIGNED_APK" ] || UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "dist/aligned.apk"
          "$APKSIGNER" sign \
            --ks release-ci.keystore \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "dist/blockreels-${TAG}.apk" \
            "dist/aligned.apk"
          rm -f "dist/aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "dist/blockreels-${TAG}.apk" | tee dist/signature.log
          if grep -q 'CN=Android Debug' dist/signature.log; then
            echo "ERROR: Debug certificate detected on production release APK."
            exit 1
          fi
          rm -f dist/signature.log

          cp app/build/outputs/bundle/release/app-release.aab "dist/blockreels-${TAG}.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-ci.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            "dist/blockreels-${TAG}.aab" \
            "$RELEASE_KEY_ALIAS"
          rm -f release-ci.keystore

          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish Stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*

      - name: Upload Signed AAB to Google Play Production Track (Optional)
        if: secrets.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blockreels.app
          releaseFiles: dist/*.aab
          track: production
          status: completed
